[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refua-clinical"
version = "0.6.0"
description = "PK/PD-driven virtual patient and clinical trial simulation toolkit for Refua."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JJ Ben-Joseph", email = "jj@tensorspace.ai"}]
keywords = [
  "drug discovery",
  "clinical trial simulation",
  "pkpd",
  "virtual patients",
  "bayesian adaptive design",
  "refua",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.2",
  "scipy>=1.13.0",
  "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://agentcures.com/"
Repository = "https://github.com/agentcures/refua"
Documentation = "https://github.com/agentcures/refua#readme"
Changelog = "https://github.com/agentcures/refua/blob/main/refua-clinical/CHANGELOG.md"
Issues = "https://github.com/agentcures/refua/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pandas-stubs>=2.2.3.250527",
  "types-PyYAML>=6.0.12.20250915",
  "build>=1.2.2",
  "twine>=6.1.0",
]
admet = [
  "refua>=0.6.0",
]
integrations = [
  "refua-data>=0.6.0",
  "refua-regulatory>=0.6.0",
]

[project.scripts]
refua-clinical = "refua_clinical.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
refua_clinical = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
